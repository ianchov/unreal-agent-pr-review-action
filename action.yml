name: Unreal Agent PR Review
description: Review pull requests with Unreal Agent in a nono sandbox and post the review as a PR comment.
author: ianchov
branding:
  icon: eye
  color: purple

inputs:
  provider:
    description: 'Model provider: "anthropic", "openai", or "openrouter".'
    default: anthropic
  anthropic-api-key:
    description: Anthropic API key, for provider anthropic. It stays in the nono proxy and never enters the sandbox.
    default: ""
  openai-api-key:
    description: OpenAI API key, for provider openai. It stays in the nono proxy and never enters the sandbox.
    default: ""
  openrouter-api-key:
    description: OpenRouter API key, for provider openrouter. It stays in the nono proxy and never enters the sandbox.
    default: ""
  model:
    description: >-
      Model for the agent and the reviewer check, in the provider's naming. Defaults to
      claude-sonnet-5-5 for anthropic and openai/gpt-6-sol for openrouter. Required for openai,
      for example "gpt-5".
    default: ""
  max-review-rounds:
    description: Most agent and reviewer-check rounds per run.
    default: "3"
  review-timeout-minutes:
    description: Time limit for all review rounds. The runner has no timeout for each model request.
    default: "40"
  diff-exclude:
    description: >-
      Extra paths to leave out of the diff, one git pathspec per line, for example
      "app/staticfiles". Common lockfiles are always left out.
    default: ""
  review-mode:
    description: >-
      Review to run: "standard" or "adversarial". Each mode posts its own PR comment and artifact.
      To run both, use one job per mode. Pass the first review to the second with prior-review.
    default: standard
  prior-review:
    description: >-
      Path to an earlier review of the same pull request, for example the standard review's review.md.
      This review then reports only defects that the earlier review does not report.
      Empty, or a missing or empty file, means no earlier review.
    default: ""
  skip-renovate:
    description: Skip pull requests opened by Renovate (renovate[bot]).
    default: "true"
  skip-reason:
    description: >-
      Skip this review and mark this mode's existing comment as not reviewed for this commit, with
      this reason. For example, skip the adversarial review when the standard review found a P0
      or P1 defect. Empty means review.
    default: ""

outputs:
  status:
    description: Reviewer-check result, for example "Passed the reviewer check.". Empty when the PR was skipped.
    value: ${{ steps.review.outputs.status }}
  skipped:
    description: "\"true\" when the PR was skipped: draft, fork, Dependabot, Renovate, or skip-reason."
    value: ${{ steps.gate.outputs.skipped }}
  verdict:
    description: >-
      The review's verdict line: "Ready to merge", "Merge after fixes", or "Needs rework".
      Empty when the PR was skipped or the review has no such line.
    value: ${{ steps.review.outputs.verdict }}
  highest-severity:
    description: >-
      The most severe finding of the review: "P0", "P1", "P2", or "P3", or "none" without findings.
      Empty when the PR was skipped or the review has no Findings section.
    value: ${{ steps.review.outputs.highest-severity }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        SKIP_RENOVATE: ${{ inputs.skip-renovate }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        # Only the key of the chosen provider. The review step selects the same way.
        LLM_API_KEY: >-
          ${{ inputs.provider == 'anthropic' && inputs.anthropic-api-key
          || inputs.provider == 'openai' && inputs.openai-api-key
          || inputs.provider == 'openrouter' && inputs.openrouter-api-key || '' }}
        MAX_REVIEW_ROUNDS: ${{ inputs.max-review-rounds }}
        REVIEW_TIMEOUT_MINUTES: ${{ inputs.review-timeout-minutes }}
        REVIEW_MODE: ${{ inputs.review-mode }}
        SKIP_REASON: ${{ inputs.skip-reason }}
      run: bash "$GITHUB_ACTION_PATH/scripts/gate.sh"
    # Marks this mode's existing comment as outdated: a new commit is being reviewed, or this
    # commit is not reviewed (skip-reason). A failed note must not stop the review.
    - if: steps.gate.outputs.skipped == 'false' || steps.gate.outputs.skip-note != ''
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MARKER_SUFFIX: ${{ steps.gate.outputs.suffix }}
        SKIP_NOTE: ${{ steps.gate.outputs.skip-note }}
      run: bash "$GITHUB_ACTION_PATH/scripts/comment.sh" pending
    - if: steps.gate.outputs.skipped == 'false'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - if: steps.gate.outputs.skipped == 'false'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"
    - if: steps.gate.outputs.skipped == 'false'
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        DIFF_EXCLUDE: ${{ inputs.diff-exclude }}
        PROMPT_DIR: ${{ steps.gate.outputs.prompt-dir }}
        PRIOR_REVIEW: ${{ inputs.prior-review }}
        LLM_DOMAIN: ${{ steps.gate.outputs.llm-domain }}
        LLM_UPSTREAM: ${{ steps.gate.outputs.llm-upstream }}
        LLM_HEADER: ${{ steps.gate.outputs.llm-header }}
        LLM_FORMAT: ${{ steps.gate.outputs.llm-format }}
        LLM_PATH: ${{ steps.gate.outputs.llm-path }}
      run: bash "$GITHUB_ACTION_PATH/scripts/prepare.sh"
    - id: review
      if: steps.gate.outputs.skipped == 'false'
      shell: bash
      env:
        # Only the key of the chosen provider enters this step; nono keeps it out of the sandbox.
        UNREAL_HARNESS_LLM_API_KEY: >-
          ${{ inputs.provider == 'anthropic' && inputs.anthropic-api-key
          || inputs.provider == 'openai' && inputs.openai-api-key
          || inputs.provider == 'openrouter' && inputs.openrouter-api-key || '' }}
        UNREAL_HARNESS_LLM_PROVIDER: ${{ inputs.provider }}
        UNREAL_HARNESS_LLM_MODEL: ${{ steps.gate.outputs.model }}
        MAX_REVIEW_ROUNDS: ${{ inputs.max-review-rounds }}
        REVIEW_TIMEOUT_MINUTES: ${{ inputs.review-timeout-minutes }}
      run: timeout "${REVIEW_TIMEOUT_MINUTES}m" bash "$GITHUB_ACTION_PATH/scripts/review.sh"
    - if: steps.gate.outputs.skipped == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MODEL: ${{ steps.gate.outputs.model }}
        MARKER_SUFFIX: ${{ steps.gate.outputs.suffix }}
        TITLE: ${{ steps.gate.outputs.title }}
      run: bash "$GITHUB_ACTION_PATH/scripts/comment.sh"
    - if: always() && steps.gate.outputs.skipped == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: unreal-agent-review-${{ github.event.pull_request.number }}${{ steps.gate.outputs.suffix }}
        path: |
          ${{ runner.temp }}/unreal-agent/*.jsonl
          ${{ runner.temp }}/unreal-agent/review.md
        if-no-files-found: ignore
        overwrite: true
